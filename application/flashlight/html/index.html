<script type="text/javascript">var Ajax = {
    get: function (url, fn) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.onreadystatechange = function () {
            if (xhr.readyState == 4 && xhr.status == 200 || xhr.status == 304) {
                fn.call(this, xhr.responseText);
            }
        };
        xhr.send();
    }, post: function (url, data, fn) {
        var xhr = new XMLHttpRequest();
        xhr.open("POST", url, true);
        xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
        xhr.onreadystatechange = function () {
            if (xhr.readyState == 4 && (xhr.status == 200 || xhr.status == 304)) {
                fn.call(this, xhr.responseText);
            }
        };
        xhr.send(data);
    }
}
var timerHandle;

function checkConnectStatus(result) {
    console.log(result)
    if (result == "OK") {
        var connect = document.getElementById("connect");
        connect.style.backgroundColor = "#58c247";
        connect.innerText = "已连接";
        clearInterval(timerHandle);
    }
}

var common = (function () {
    var strEmpty = function (value) {
        if (value == undefined || value == null || value == '') {
            return true;
        }
    }
    return {strEmpty: strEmpty}
}())
var buzi = (function () {
    var result = function (value) {
        console.log(value)
        var connect = document.getElementById("connect");
        connect.style.backgroundColor = "#47c29a";
        connect.innerText = "开始连接";
        timerHandle = setInterval(() => {
            var url = '/getStatus';
            Ajax.get(url, checkConnectStatus)
        }, 3000);
    }
    var initRt = function (value) {
    }
    var init = function () {
        let url = '/scan';
        Ajax.get(url, buzi.initRt)
    }
    var getNetWork = function () {
        let url = '/getNetWork';
        let deviceSelect = document.getElementById('device-select')
        Ajax.get(url, function (result) {
            console.log(result)
            let payload = JSON.parse(result)
            let data = payload.data
            if (payload.ssid != null && payload.length > 0) {
                data.unshift(payload.ssid)
            }
            if (payload.length > 0) {
                showSelect()
                for (i in data) {
                    deviceSelect.add(new Option(data[i], data[i]))
                }
            }
        })
    }
    return {result: result, init: init, initRt: initRt, getNetWork: getNetWork}
}())
buzi.init()
setTimeout(function () {
    buzi.getNetWork()
}, 3000)
var isConnect = false
var connect = document.getElementById("connect");
connect.onclick = function () {
    var username = document.getElementById("username").value;
    var password = document.getElementById("password").value;
    var mqttUrl = document.getElementById("mqttUrl").value;
    var topic = document.getElementById("topic").value;
    var mqtt_username = document.getElementById("mqtt_username").value;
    var mqtt_password = document.getElementById("mqtt_password").value;
    var deviceName = document.getElementById("device-select").value;
    if (common.strEmpty(username) && common.strEmpty(deviceName)) {
        alert("请填写WIFI用户名");
        return false;
    }
    if (common.strEmpty(password)) {
        alert("请填写WIFI密码");
        return false;
    }
    if (isConnect) {
        alert("正在连接中......");
        return false
    }
    let Network = isInput ? username : deviceName
    isConnect = true
    let data = {"Network": Network, "Password": password, "mqttUrl": mqttUrl, "topic": topic, "mqtt_username": mqtt_username, "mqtt_password": mqtt_password}
    var url = '/saveInfo';
    let payload = JSON.stringify(data);
    Ajax.post(url, payload, buzi.result)
    isConnect = false
};
var isInput = true
var username = document.getElementById("a-username");
username.onclick = function () {
    showSelect()
}

function showSelect() {
    var select = document.getElementsByClassName("show-select")
    var i
    for (i = 0; i < select.length; i++) {
        select[i].style.display = 'inline-block'
    }
    var input = document.getElementsByClassName("show-input")
    var y
    for (y = 0; y < select.length; y++) {
        input[y].style.display = 'none'
    }
    isInput = false
}

var username = document.getElementById("a-device-select");
username.onclick = function () {
    var select = document.getElementsByClassName("show-select")
    var i
    for (i = 0; i < select.length; i++) {
        select[i].style.display = 'none'
    }
    var input = document.getElementsByClassName("show-input")
    var y
    for (y = 0; y < select.length; y++) {
        input[y].style.display = 'inline-block'
    }
    isInput = true
}</script>
